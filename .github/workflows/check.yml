name: Check
on: [push, pull_request]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - uses: actions/cache@v4
        with:
          path: artifacts/upstream
          key: ytdlnis-runtimes-${{ hashFiles('tools/prepare_android_runtimes.py') }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --refresh-dependencies :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: keyflow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m unittest discover -s companion -v
